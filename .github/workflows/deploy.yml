name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # usa as chaves públicas do .env.production (a proteção é o RLS do Supabase)
      - run: npm run build
      # PR: publica em um canal de preview com link temporário
      - if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SENAC_GESTAO }}
          projectId: senac-gestao
          target: agenda
          expires: 7d
      # main: publica em produção (agenda.bryam.com.br)
      - if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SENAC_GESTAO }}
          projectId: senac-gestao
          target: agenda
          channelId: live
